import javax.inject.Inject

plugins {
    id("java")
    id("application")
}

group = project.maven_group
version = project.launcher_version

def launcherDisplayVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('launcherVersion', launcherDisplayVersion)
    filesMatching('com/fuzzlauncher/version.properties') {
        expand(launcherVersion: launcherDisplayVersion)
    }
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // This launcher targets Windows x64, including its JavaFX native libraries.
    for (def module : ['base', 'graphics', 'controls', 'swing']) {
        implementation("org.openjfx:javafx-${module}:${javafx_version}:win") {
            transitive = false
        }
    }
    implementation("com.google.code.gson:gson:${gson_version}")
    implementation("org.tomlj:tomlj:${tomlj_version}")
    implementation("com.microsoft.azure:msal4j:${msal_version}")
    implementation("net.java.dev.jna:jna-platform:${jna_version}")
    runtimeOnly("org.slf4j:slf4j-nop:${slf4j_version}")
    compileOnly("org.jetbrains:annotations:${jetbrains_annotations_version}")
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation("com.tngtech.archunit:archunit:${archunit_version}")
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

application {
    mainClass = 'com.fuzzlauncher.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def fuzzProperties = providers.systemPropertiesPrefixedBy('fuzz.')

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties(fuzzProperties.get())
    // Re-run explicitly requested network/UI verification even if sources did not change.
    if (fuzzProperties.get().values().any { it == 'true' }) {
        outputs.upToDateWhen { false }
    }
    testLogging {
        events('failed', 'skipped')
        exceptionFormat = 'full'
    }
}

tasks.named('run', JavaExec) {
    systemProperties(fuzzProperties.get())
}

def javafxLibraries = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') }
def runtimeLibraries = configurations.runtimeClasspath.filter { !it.name.startsWith('javafx-') }

tasks.named('jar', Jar) {
    inputs.files(runtimeLibraries)
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    doFirst {
        manifest.attributes('Class-Path': runtimeLibraries.collect { "lib/${it.name}" }.join(' '))
    }
}

tasks.register('preparePackage', Sync) {
    description = 'Stages the launcher and runtime dependencies for Windows jpackage.'
    group = 'distribution'
    dependsOn(tasks.named('jar'))
    into(layout.buildDirectory.dir('package-input'))
    from(tasks.named('jar'))
    into('lib') {
        from(runtimeLibraries)
    }
}

tasks.register('prepareJavafx', Sync) {
    description = 'Stages JavaFX modules and native DLLs for jlink.'
    group = 'distribution'
    into(layout.buildDirectory.dir('javafx'))
    into('lib') {
        from(javafxLibraries)
    }
    into('bin') {
        from({ javafxLibraries.collect { zipTree(it) } })
        include('**/*.dll')
        eachFile { path = "bin/${name}" }
        includeEmptyDirs = false
    }
}

abstract class WindowsPackagingServices {
    @Inject abstract ExecOperations getProcesses()
    @Inject abstract FileSystemOperations getFiles()
}

def packaging = objects.newInstance(WindowsPackagingServices)
def windowsJdk = javaToolchains.compilerFor(java.toolchain).map { it.metadata.installationPath }
def packageInput = layout.buildDirectory.dir('package-input')
def javafxInput = layout.buildDirectory.dir('javafx')
def archive = tasks.named('jar', Jar).flatMap { it.archiveFileName }
def icon = layout.projectDirectory.file('src/main/resources/com/fuzzlauncher/launcher.ico')
def installerScript = layout.projectDirectory.file('FuzzLauncher.iss')
def installerCompiler = providers.gradleProperty('isccPath').orElse('ISCC.exe')
def buildId = new Date().format('yyyyMMdd-HHmmss-SSS')
def destination = layout.projectDirectory.dir("dist/${buildId}")
def runtime = layout.buildDirectory.dir("runtime-${buildId}")
def vendor = '1024_byteeeee'
def nativeVersion = providers.provider {
    def match = launcherDisplayVersion =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!match.find()) {
        throw new GradleException('Windows packaging requires a MAJOR.MINOR.PATCH application version.')
    }
    def segments = (1..3).collect { new BigInteger(match.group(it)) }
    if (segments[0] > 255 || segments[1] > 255 || segments[2] > 65535) {
        throw new GradleException('Windows installer version requires major/minor <= 255 and patch <= 65535.')
    }
    match.group()
}

def packageWindows = tasks.register('packageWindows') {
    group = 'distribution'
    description = 'Builds and tests the Windows launcher, then creates a portable application image.'
    dependsOn(tasks.named('build'), tasks.named('preparePackage'), tasks.named('prepareJavafx'))
    doLast {
        def version = nativeVersion.get()
        def jdk = windowsJdk.get()
        def javafx = javafxInput.get()
        def image = runtime.get()
        packaging.processes.exec {
            executable = jdk.file('bin/jlink.exe').asFile
            args '--module-path', "${jdk.dir('jmods').asFile};${javafx.dir('lib').asFile}",
                '--add-modules', 'java.se,javafx.controls,javafx.swing,jdk.httpserver,jdk.crypto.ec,jdk.unsupported,jdk.management',
                '--strip-debug', '--no-header-files', '--no-man-pages',
                '--exclude-files', 'glob:**/legal/**,glob:**/README*,glob:**/readme*', '--output', image.asFile
        }
        packaging.files.copy {
            from(javafx.dir('bin'))
            into(image.dir('bin'))
        }
        packaging.processes.exec {
            executable = jdk.file('bin/jpackage.exe').asFile
            args '--type', 'app-image', '--name', 'FuzzLauncher', '--dest', destination.asFile,
                '--input', packageInput.get().asFile, '--main-jar', archive.get(), '--main-class', 'com.fuzzlauncher.Launcher',
                '--runtime-image', image.asFile, '--app-version', version, '--vendor', vendor, '--icon', icon.asFile,
                '--java-options', '--add-modules=javafx.controls,javafx.swing,jdk.httpserver,jdk.management'
        }
        logger.lifecycle("Portable application: ${destination.file('FuzzLauncher/FuzzLauncher.exe').asFile}")
    }
}

tasks.register('packageWindowsInstaller') {
    group = 'distribution'
    description = 'Creates the portable Windows application and compiles its Inno Setup installer.'
    dependsOn(packageWindows)
    doLast {
        def output = destination.dir('installer').asFile
        packaging.processes.exec {
            executable = installerCompiler.get()
            args "/DAppVersion=${nativeVersion.get()}", "/DSrcDir=${destination.dir('FuzzLauncher').asFile}",
                "/DOutputDir=${output}", installerScript.asFile
        }
        logger.lifecycle("Windows installer: ${output}")
    }
}
