name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Read application version
        id: release
        run: |
          $version = (Select-String -LiteralPath gradle.properties -Pattern '^launcher_version\s*=\s*(.+)$').Matches.Groups[1].Value.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: x64
          cache: gradle

      - name: Set up Inno Setup 6.5.4
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'FA73BF47A4DA250D185D07561C2BFDA387E5E20DB77E4570004CF6A133CC10B1') {
            throw 'Inno Setup installer checksum mismatch.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$directory`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          if (!(Test-Path -LiteralPath "$directory/ISCC.exe")) { throw 'Inno Setup compiler is missing.' }
          $directory >> $env:GITHUB_PATH

      - name: Build and test Windows packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./build.ps1 -Installer -JdkPath $env:JAVA_HOME -Version $env:RELEASE_VERSION

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builds = @(Get-ChildItem -LiteralPath dist -Directory)
          if ($builds.Count -ne 1) { throw 'Expected exactly one package output directory.' }
          $build = $builds[0].FullName
          $installers = @(Get-ChildItem -LiteralPath "$build/installer" -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $assets = New-Item -ItemType Directory -Path build/release-assets
          $prefix = "FuzzLauncher-$env:RELEASE_VERSION-windows-x64"
          Copy-Item -LiteralPath $installers[0].FullName -Destination "$assets/$prefix-setup.exe"
          Compress-Archive -LiteralPath "$build/FuzzLauncher" -DestinationPath "$assets/$prefix-portable.zip"
          $checksums = Get-ChildItem -LiteralPath $assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $checksums | Set-Content -LiteralPath "$assets/SHA256SUMS.txt" -Encoding utf8

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath build/release-assets -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
