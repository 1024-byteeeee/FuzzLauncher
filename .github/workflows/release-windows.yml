name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -creplace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Use a release tag such as v0.2.0 or v0.2.0-beta.1.'
          }
          $release = gh release view $env:RELEASE_TAG --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.tagName -cne $env:RELEASE_TAG) {
            throw 'A published release with this exact tag is required.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: x64
          cache: gradle

      - name: Set up WiX 3.14.1
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'wix314.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $directory >> $env:GITHUB_PATH

      - name: Build and test Windows packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./build.ps1 -Installer -JdkPath $env:JAVA_HOME -Version $env:RELEASE_VERSION

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builds = @(Get-ChildItem -LiteralPath dist -Directory)
          if ($builds.Count -ne 1) { throw 'Expected exactly one package output directory.' }
          $build = $builds[0].FullName
          $installers = @(Get-ChildItem -LiteralPath "$build/installer" -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $assets = New-Item -ItemType Directory -Path build/release-assets
          $prefix = "FuzzLauncher-$env:RELEASE_VERSION-windows-x64"
          Copy-Item -LiteralPath $installers[0].FullName -Destination "$assets/$prefix-setup.exe"
          Compress-Archive -LiteralPath "$build/FuzzLauncher" -DestinationPath "$assets/$prefix-portable.zip"
          $checksums = Get-ChildItem -LiteralPath $assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $checksums | Set-Content -LiteralPath "$assets/SHA256SUMS.txt" -Encoding utf8

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath build/release-assets -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
